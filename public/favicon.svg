<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4b58"/>
      <stop offset="100%" stop-color="#13333d"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5bd75" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b88a3b" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect width="180" height="180" rx="40" fill="url(#tealGrad)"/>
  <!-- Gold Accent Ring -->
  <rect x="4" y="4" width="172" height="172" rx="36" stroke="url(#goldBorder)" stroke-width="2.5"/>
  <!-- Authentic Encalm Gold Emblem -->
  <image href="data:image/png;base64," x="26" y="26" width="128" height="128" preserveAspectRatio="xMidYMid meet"/>
</svg>
