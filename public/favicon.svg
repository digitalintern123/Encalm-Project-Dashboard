<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4e5b"/>
      <stop offset="100%" stop-color="#13333d"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5bd75" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b88a3b" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect width="180" height="180" rx="42" fill="url(#tealGrad)"/>
  <!-- Gold Accent Ring -->
  <rect x="3" y="3" width="174" height="174" rx="39" stroke="url(#goldBorder)" stroke-width="2.5"/>
  <!-- Authentic Encalm Gold Emblem -->
  <image href="data:image/png;base64," x="25" y="25" width="130" height="130" preserveAspectRatio="xMidYMid meet"/>
</svg>
